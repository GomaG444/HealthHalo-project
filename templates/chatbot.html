<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HealthHalo Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="text-center font-bold text-xl text-blue-900 mb-6">
    HealthHalo Chatbot
  </header>

  <!-- Main content -->
  <main class="flex-grow max-w-lg mx-auto w-full p-4">

    <!-- Chat card -->
    <div class="bg-gray-100 rounded-3xl shadow-xl flex flex-col h-[500px] overflow-hidden">

      <!-- Chat window -->
      <div id="chat-window" class="flex-grow p-4 overflow-y-auto space-y-3">
        <!-- Chat messages appear here -->
      </div>

      <!-- Input form -->
      <form id="chat-form" class="flex p-4 gap-2 bg-gray-50">
        <input id="user-input" type="text" placeholder="Type your message..." class="flex-grow border border-gray-300 rounded-xl p-3 focus:outline-blue-500" required />
        <button type="submit" class="bg-blue-100 text-blue-700 px-5 rounded-xl hover:bg-blue-200 transition">Send</button>
      </form>

    </div>

  </main>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'flex flex-col items-end' : 'flex flex-col items-start';

      // Small label (User/AI)
      const label = document.createElement('span');
      label.className = 'text-xs text-gray-500 mb-1';
      label.textContent = sender === 'user' ? 'You' : 'AI';
      div.appendChild(label);

      // Message bubble
      const bubble = document.createElement('div');
      bubble.className = 'max-w-[70%] p-3 rounded-2xl shadow';
      bubble.textContent = text;

      if(sender === 'user'){
        bubble.classList.add('bg-white','text-blue-700');
        bubble.classList.add('rounded-br-none');
      } else {
        bubble.classList.add('bg-white','text-blue-900');
        bubble.classList.add('rounded-bl-none');
      }
      div.appendChild(bubble);

      // Timestamp
      const timestamp = document.createElement('span');
      const now = new Date();
      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      timestamp.textContent = `${hh}:${mm}`;
      timestamp.className = 'text-xs text-gray-400 mt-1';
      div.appendChild(timestamp);

      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessageToChatbot(message) {
      appendMessage(message, 'user');

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        if (!response.ok) {
          appendMessage("Sorry, something went wrong with the AI response.", 'ai');
          return;
        }

        const data = await response.json();
        appendMessage(data.reply || "No reply from AI.", 'ai');

        if (data.summary && data.risk_score !== undefined && data.predicted_class !== undefined) {
          const saveResp = await fetch('/save_data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              summary: data.summary,
              risk_score: data.risk_score,
              predicted_class: data.predicted_class,
              lstm_summary: data.lstm_summary || "Stable heart rate and blood pressure trends."
            })
          });
          const saveResult = await saveResp.json();
          if (saveResult.status === 'success') {
            console.log("Summary and prediction saved successfully");
          } else {
            console.error("Failed to save data:", saveResult.message);
          }
        } else {
          console.warn("Missing summary or prediction data, not saving.");
        }

      } catch (error) {
        appendMessage("Error communicating with the AI service.", 'ai');
        console.error(error);
      }
    }

    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (message) {
        sendMessageToChatbot(message);
        userInput.value = '';
      }
    });
  </script>

</body>
</html>
